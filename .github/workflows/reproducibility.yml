name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the locked environment
        run: |
          python -m pip install --requirement requirements-lock.txt
          python -m pip install --requirement requirements-verification.txt

      - name: Run unit and regression tests
        run: python -m unittest discover -s code -p "test_*.py" -v

      - name: Regenerate and validate all artifacts
        run: python code/reproduce_all.py

      - name: Run the symbolic verification notebook
        run: >-
          python verification/run_verification.py
          --output executed/verify_manuscript.ipynb

      - name: Archive regenerated artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rotating-vacuum-reproduction-artifacts
          path: |
            data/*.csv
            data/*.json
            data/*.txt
            figures/*.pdf
            figures/*.png
            executed/verify_manuscript.ipynb
          if-no-files-found: error
